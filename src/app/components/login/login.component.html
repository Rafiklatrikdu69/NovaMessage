<div class="flex min-h-screen items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Sign in to your account</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="w-full px-3 py-2 border rounded-md focus:outline-indigo-500"
          [ngClass]="{'border-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
        <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-red-500 text-sm">
          Please enter a valid email.
        </p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="w-full px-3 py-2 border rounded-md focus:outline-indigo-500"
          [ngClass]="{'border-red-500': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
        <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-sm">
          Password is required.
        </p>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-500 disabled:opacity-50">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="mt-6">
      <button
        (click)="loginWithGoogle()"
        [disabled]="isLoading"
        class="w-full flex items-center justify-center gap-2 border py-2 rounded-md hover:bg-gray-100 disabled:opacity-50">
        <i class="pi pi-google"></i>
        Sign in with Google
      </button>
    </div>

    <p class="mt-6 text-center text-sm text-gray-600">
      Not a member? <a routerLink="/signup" class="text-indigo-600 hover:underline">Sign up now</a>
    </p>

    <p *ngIf="errorMessage" class="mt-4 text-center text-red-500 text-sm">
      {{ errorMessage }}
    </p>
  </div>
</div>
